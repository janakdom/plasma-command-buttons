<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Command Buttons</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4cc2f5"/>
      <stop offset="1" stop-color="#1e63d6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="shape">
      <rect x="24" y="24" width="464" height="464" rx="112"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0b2a66" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- podklad -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="260" fill="url(#shine)" clip-path="url(#shape)"/>

  <!-- mřížka dlaždic -->
  <g filter="url(#shadow)" fill="#ffffff">
    <rect x="108" y="108" width="140" height="140" rx="30"/>
    <rect x="264" y="108" width="140" height="140" rx="30"/>
    <rect x="108" y="264" width="140" height="140" rx="30"/>
    <rect x="264" y="264" width="140" height="140" rx="30"/>
  </g>

  <!-- >_  terminál -->
  <g fill="none" stroke="#1e63d6" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="146,150 178,178 146,206"/>
    <line x1="190" y1="208" x2="214" y2="208"/>
  </g>

  <!-- ▶ spustit -->
  <path d="M316,146 L370,178 L316,210 Z" fill="#f67400" stroke="#f67400" stroke-width="12" stroke-linejoin="round"/>

  <!-- ✓ hotovo -->
  <polyline points="146,336 170,360 212,310" fill="none" stroke="#27ae60" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ⋯ další -->
  <g fill="#8e44ad">
    <circle cx="300" cy="334" r="13"/>
    <circle cx="334" cy="334" r="13"/>
    <circle cx="368" cy="334" r="13"/>
  </g>
</svg>
